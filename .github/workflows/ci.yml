name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ensure lint runtime deps
        run: pnpm add -D eslint eslint-config-next --ignore-workspace-root-check

      - name: Lint (gating)
        run: pnpm lint

      - name: Test (typecheck + smoke)
        run: pnpm test

      - name: Build
        run: pnpm build
